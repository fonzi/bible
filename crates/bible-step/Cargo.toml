[package]
name = "bible-step"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interlinear and lexicon data from STEP Bible (CC BY 4.0), downloaded on demand"

[dependencies]
bible-core = { path = "../bible-core" }
flate2 = "1"
ureq = { version = "2", features = ["native-certs"] }
once_cell = "1"

[dev-dependencies]
bible-sword = { path = "../bible-sword" }
