name: CI
on:
  push:
    branches: [main]
    # docs and website changes don't need a build
    paths-ignore: ["**.md", "website/**", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "website/**", "docs/**"]
# a newer push makes the older run pointless
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # CI builds once from a cache: no incremental files, no debug info
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # mold links several times faster than the default linker
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: xvfb-run -a cargo test --workspace
      # every file we offer to download is still there (Bible sources, STEP,
      # church fathers, audio, Wikipedia)
      - name: Download links still work
        # a site that's down warns instead of blocking; read the log
        continue-on-error: true
        run: cargo test --workspace -- --ignored download_urls
      - name: The window opens with the splash screen on
        run: |
          cargo build
          xvfb-run -a scripts/check-startup.sh target/debug/bible-app
      - name: Check the app's desktop and store metadata
        run: |
          desktop-file-validate data/io.github.fonzi.Bible.desktop
          appstreamcli validate --no-net --explain data/io.github.fonzi.Bible.metainfo.xml
