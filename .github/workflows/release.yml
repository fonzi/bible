name: Release
# Publishes a release whenever the version in Cargo.toml changes on main
# (or when run by hand from the Actions tab). The tag is created here,
# on the commit that was built.
on:
  push:
    branches: [main]
    paths: ["Cargo.toml", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      created: ${{ steps.v.outputs.exists != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Read the version
        id: v
        run: |
          ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install build dependencies
        if: steps.v.outputs.exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        if: steps.v.outputs.exists != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.v.outputs.exists != 'true'
      - name: Build the Debian package
        if: steps.v.outputs.exists != 'true'
        run: |
          cargo install cargo-deb --locked
          cargo build --release
          cargo deb -p bible-app --no-build
      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.exists != 'true'
        run: |
          awk -v v="## ${{ steps.v.outputs.version }}" '
            $0 == v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See the commits below." > notes.md
      - name: Publish the release
        if: steps.v.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Bible ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: target/debian/*.deb
          body_path: notes.md
          generate_release_notes: true

  # The same release as a Flatpak, which brings its own GNOME libraries and so
  # runs on older systems too (Ubuntu and Pop!_OS 22.04, Debian 12…).
  flatpak:
    needs: deb
    if: needs.deb.outputs.created == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: List the crates for an offline build
        run: |
          pip install --break-system-packages aiohttp tomlkit 2>/dev/null || pip install aiohttp tomlkit
          curl -sSLo /tmp/gen.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/gen.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: bible-app-${{ needs.deb.outputs.version }}.flatpak
          manifest-path: packaging/flatpak/io.github.fonzi.Bible.json
          cache-key: flatpak-${{ github.sha }}
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.deb.outputs.version }}
          files: bible-app-${{ needs.deb.outputs.version }}.flatpak
