name: Release
# Publishes a release whenever the version in Cargo.toml changes on main
# (or when run by hand from the Actions tab). The tag is created here,
# on the commit that was built.
#
#   check ─┬─ linux   (tests + .deb, one build)   ─┐
#          ├─ flatpak (build + install + start)    ├─ publish
#          ├─ windows (tests + zip, untested)      │
#          └─ macos   (tests + zip, untested)     ─┘
#
# Nothing is published unless Linux and Flatpak pass. Windows and macOS are
# attached when they pass; we have no hardware to try them, so their files
# are named _untested.
on:
  push:
    branches: [main]
    paths: ["Cargo.toml", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.exists != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Is this version already released?
        id: v
        run: |
          ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

  # tests and the .deb share one toolchain, one cache and one release build
  linux:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      # release mode, so the package below reuses this build
      - name: Tests
        run: xvfb-run -a cargo test --workspace --release
      # every file we offer to download is still there (Bible sources, STEP,
      # church fathers, audio, Wikipedia)
      - name: Download links still work
        run: cargo test --workspace --release -- --ignored download_urls
      - name: Check the app's desktop and store metadata
        run: |
          desktop-file-validate data/io.github.fonzi.Bible.desktop
          appstreamcli validate --no-net --explain data/io.github.fonzi.Bible.metainfo.xml
      - name: Build the Debian package
        run: |
          cargo build --release
          cargo deb -p bible-app --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb

  # brings its own GNOME libraries, so it runs on older systems too
  # (Ubuntu and Pop!_OS 22.04, Debian 12…)
  flatpak:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: List the crates for an offline build
        run: |
          pip install --break-system-packages aiohttp tomlkit 2>/dev/null || pip install aiohttp tomlkit
          curl -sSLo /tmp/gen.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/gen.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: bible-app-${{ needs.check.outputs.version }}.flatpak
          manifest-path: packaging/flatpak/io.github.fonzi.Bible.json
          cache-key: flatpak-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.json') }}
          upload-artifact: false
      - name: The bundle installs and the app starts
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive ./bible-app-${{ needs.check.outputs.version }}.flatpak
          flatpak run --user --command=bible-app io.github.fonzi.Bible --help
      - name: Downloads survive an update
        run: |
          flatpak run --user --command=sh io.github.fonzi.Bible -c 'mkdir -p "$XDG_DATA_HOME/sword/mods.d" && echo kept > "$XDG_DATA_HOME/sword/mods.d/marker.conf"'
          flatpak install --user -y --noninteractive --reinstall ./bible-app-${{ needs.check.outputs.version }}.flatpak
          flatpak run --user --command=sh io.github.fonzi.Bible -c 'cat "$XDG_DATA_HOME/sword/mods.d/marker.conf"' | grep -q kept
          echo "Data in the app's folder is kept across updates"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: bible-app-${{ needs.check.outputs.version }}.flatpak

  windows:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            zip curl tar xz
          pacboy: >-
            gtk4:p libadwaita:p gstreamer:p gst-plugins-base:p gst-plugins-good:p
            rust:p pkgconf:p gcc:p
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-
      - name: Tests
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p bible-app
      - name: Bundle the app with its libraries and fonts
        run: packaging/windows/bundle.sh bible-app-${{ needs.check.outputs.version }}-windows_untested.zip
      - name: The bundled app starts on its own
        run: ./dist/Bible/bin/bible-app.exe --help
      - name: The bundled fonts are found
        run: ./dist/Bible/bin/bible-app.exe --check-fonts
      - name: The window opens without missing fonts or files
        run: |
          BIBLE_APP_SECTION=bible ./dist/Bible/bin/bible-app.exe > run.log 2>&1 &
          sleep 20
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/screenshot.ps1 screen.png || true
          alive=0; tasklist | grep -qi bible-app.exe && alive=1
          taskkill //F //IM bible-app.exe >/dev/null 2>&1 || true
          cat run.log
          [ $alive = 1 ] || { echo "The app quit or crashed"; exit 1; }
          if grep -iE "couldn.t load font|No GSettings schemas|Could not load a pixbuf|Failed to load module" run.log; then
            echo "The app is missing something it needs"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: screen.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: bible-app-*-windows_untested.zip

  macos:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK and the bundling tools
        run: brew install gtk4 libadwaita gstreamer pkgconf adwaita-icon-theme librsvg dylibbundler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
      - name: Tests
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p bible-app
      - name: Bundle Bible.app with its libraries and fonts
        run: packaging/macos/bundle.sh ${{ needs.check.outputs.version }} bible-app-${{ needs.check.outputs.version }}-macos_untested.zip
      - name: Nothing in the app points at Homebrew
        run: |
          if find dist/Bible/Bible.app -type f \( -name '*.dylib' -o -name '*.so' -o -perm -u+x \) \
               -exec otool -L {} \; 2>/dev/null | grep -E '/opt/homebrew|/usr/local/(opt|Cellar|lib)/'; then
            echo "These still need Homebrew"; exit 1
          fi
      - name: The app runs with Homebrew out of the way
        run: |
          sudo mv /opt/homebrew /opt/homebrew-away
          a=dist/Bible/Bible.app/Contents/MacOS/bible-app
          $a --help
          $a --check-fonts
          BIBLE_APP_SECTION=bible $a > run.log 2>&1 &
          pid=$!
          sleep 20
          screencapture -x screen.png || true
          alive=0; kill -0 $pid 2>/dev/null && alive=1
          kill $pid 2>/dev/null || true
          sudo mv /opt/homebrew-away /opt/homebrew
          cat run.log
          [ $alive = 1 ] || { echo "The app quit or crashed"; exit 1; }
          if grep -E "No GSettings schemas|Couldn.t recognize the image|Could not load a pixbuf|couldn.t load font|Failed to load module|Library not loaded" run.log; then
            echo "The app is missing something it needs"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshot
          path: screen.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: bible-app-${{ needs.check.outputs.version }}-macos_untested.zip

  publish:
    needs: [check, linux, flatpak, windows, macos]
    # Linux and Flatpak must pass; untested platforms come along if they built
    if: >-
      always() && needs.check.outputs.new == 'true' &&
      needs.linux.result == 'success' && needs.flatpak.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## ${{ needs.check.outputs.version }}" '
            $0 == v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See the commits below." > notes.md
          if ls out/*_untested.zip >/dev/null 2>&1; then
            printf '\n**Windows and macOS** (`_untested`): built and tested automatically, but no one has run them on a real PC or Mac yet. Reports welcome.\n' >> notes.md
          fi
          ls -l out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: Bible ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            out/*.deb
            out/*.flatpak
            out/*.zip
          body_path: notes.md
          generate_release_notes: true
