name: Platforms
# Builds and tests on Flatpak, Windows and macOS. We have no Windows or Mac
# to try it on, so these runs are how we know whether it works there.
on:
  push:
    branches: [main]
    # docs and website changes don't need a build
    paths-ignore: ["**.md", "website/**", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "website/**", "docs/**"]
  workflow_dispatch:
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: List the crates for an offline build
        run: |
          pip install --break-system-packages aiohttp tomlkit 2>/dev/null || pip install aiohttp tomlkit
          curl -sSLo /tmp/gen.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/gen.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: bible-app.flatpak
          manifest-path: packaging/flatpak/io.github.fonzi.Bible.json
          cache-key: flatpak-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.json') }}
          upload-artifact: false
      - name: The bundle installs and the app starts
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive ./bible-app.flatpak
          flatpak info --user io.github.fonzi.Bible
          # the binary runs inside the sandbox (no display needed for --help)
          flatpak run --user --command=bible-app io.github.fonzi.Bible --help

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            zip curl tar xz
          pacboy: >-
            gtk4:p libadwaita:p gstreamer:p gst-plugins-base:p gst-plugins-good:p
            rust:p pkgconf:p gcc:p
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-
      - name: Build
        run: cargo build --release -p bible-app
      - name: Tests
        run: cargo test --workspace
      - name: Bundle the app with its libraries and fonts
        run: packaging/windows/bundle.sh bible-app-windows.zip
      - name: The bundled app starts on its own
        run: ./dist/Bible/bin/bible-app.exe --help
      - name: The bundled fonts are found
        run: ./dist/Bible/bin/bible-app.exe --check-fonts
      - name: The window opens without missing fonts or files
        run: |
          BIBLE_APP_SECTION=reader ./dist/Bible/bin/bible-app.exe > run.log 2>&1 &
          sleep 20
          alive=0; tasklist | grep -qi bible-app.exe && alive=1
          taskkill //F //IM bible-app.exe >/dev/null 2>&1 || true
          cat run.log
          [ $alive = 1 ] || { echo "The app quit or crashed"; exit 1; }
          if grep -iE "couldn.t load font|No GSettings schemas|Could not load a pixbuf|Failed to load module" run.log; then
            echo "The app is missing something it needs"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bible-app-windows
          path: bible-app-windows.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK and the bundling tools
        run: brew install gtk4 libadwaita gstreamer pkgconf adwaita-icon-theme librsvg dylibbundler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
      - name: Tests
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p bible-app
      - name: Bundle Bible.app with its libraries and fonts
        run: packaging/macos/bundle.sh 0.0.0 bible-app-macos.zip
      - name: Nothing in the app points at Homebrew
        run: |
          if find dist/Bible/Bible.app -type f \( -name '*.dylib' -o -name '*.so' -o -perm -u+x \) \
               -exec otool -L {} \; 2>/dev/null | grep -E '/opt/homebrew|/usr/local/(opt|Cellar|lib)/'; then
            echo "These still need Homebrew"; exit 1
          fi
      - name: The app runs with Homebrew out of the way
        run: |
          sudo mv /opt/homebrew /opt/homebrew-away
          a=dist/Bible/Bible.app/Contents/MacOS/bible-app
          $a --help
          $a --check-fonts
          BIBLE_APP_SECTION=reader $a > run.log 2>&1 &
          pid=$!
          sleep 20
          screencapture -x screen.png || true
          alive=0; kill -0 $pid 2>/dev/null && alive=1
          kill $pid 2>/dev/null || true
          sudo mv /opt/homebrew-away /opt/homebrew
          cat run.log
          [ $alive = 1 ] || { echo "The app quit or crashed"; exit 1; }
          if grep -E "No GSettings schemas|Couldn.t recognize the image|Could not load a pixbuf|couldn.t load font|Failed to load module|Library not loaded" run.log; then
            echo "The app is missing something it needs"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshot
          path: screen.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: bible-app-macos
          path: bible-app-macos.zip
